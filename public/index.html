<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>DzMoney</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>

  <link rel="stylesheet" href="/style.css?v=5">
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="brand-icon">💎</div>

      <div>
        <div class="brand-name">DzMoney</div>
        <div class="brand-subtitle">
          Earn • Complete • Withdraw
        </div>
      </div>
    </div>

    <button class="profile-button">
      👤
    </button>

  </header>


  <main>

    <!-- BALANCE -->

    <section class="balance-card">

      <div class="balance-top">
        <span>Total balance</span>
        <span class="online-dot">● Online</span>
      </div>

      <div class="coins">
        <span class="coin-icon">💎</span>
        <span id="coins">0</span>
      </div>

      <div class="balance-label">
        Coins
      </div>

      <div class="balance-divider"></div>

      <div class="mini-balances">

        <div class="mini-balance">

          <span class="mini-icon">
            💰
          </span>

          <div>
            <strong id="bux">0</strong>
            <small>BUX</small>
          </div>

        </div>


        <div class="mini-balance">

          <span class="mini-icon">
            TON
          </span>

          <div>
            <strong id="ton">0.000</strong>
            <small>Estimated TON</small>
          </div>

        </div>

      </div>

    </section>


    <!-- DAILY -->

    <section class="daily-card">

      <div class="daily-icon">
        🎁
      </div>

      <div class="daily-content">

        <h3>
          Daily Reward
        </h3>

        <p id="daily-text">
          Your reward is ready!
        </p>

      </div>

      <button
        id="daily-button"
        class="claim-button"
      >
        Claim
      </button>

    </section>


    <!-- EARN -->

    <div class="section-heading">

      <div>

        <h2>
          Earn more
        </h2>

        <p>
          Complete activities and earn rewards
        </p>

      </div>

    </div>


    <section class="features">


      <button
        class="feature-card"
        onclick="openSection('tasks')"
      >

        <div class="feature-icon tasks-icon">
          📺
        </div>

        <div class="feature-info">

          <h3>
            Tasks
          </h3>

          <p>
            Watch & complete
          </p>

        </div>

        <span class="arrow">
          ›
        </span>

      </button>


      <button
        class="feature-card"
        onclick="openSection('friends')"
      >

        <div class="feature-icon friends-icon">
          👥
        </div>

        <div class="feature-info">

          <h3>
            Friends
          </h3>

          <p>
            Invite & earn
          </p>

        </div>

        <span class="arrow">
          ›
        </span>

      </button>


      <button
        class="feature-card"
        onclick="openSection('wallet')"
      >

        <div class="feature-icon wallet-icon">
          💳
        </div>

        <div class="feature-info">

          <h3>
            Wallet
          </h3>

          <p>
            Withdraw BUX
          </p>

        </div>

        <span class="arrow">
          ›
        </span>

      </button>


      <button
        class="feature-card coming-soon"
      >

        <div class="feature-icon investment-icon">
          🚀
        </div>

        <div class="feature-info">

          <h3>
            Investment
          </h3>

          <p>
            Coming soon
          </p>

        </div>

        <span class="soon-badge">
          SOON
        </span>

      </button>

    </section>


    <!-- WITHDRAW INFO -->

    <section class="info-card">

      <div class="info-icon">
        💰
      </div>

      <div>

        <strong>
          BUX withdrawals
        </strong>

        <p>
          Minimum withdrawal
          <b>
            2,000 BUX
          </b>
          = 0.2 TON
        </p>

      </div>

    </section>

  </main>


  <!-- NAVIGATION -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      data-page="home"
      onclick="openSection('home')"
    >
      <span>⌂</span>
      <small>Home</small>
    </button>


    <button
      class="nav-item"
      data-page="tasks"
      onclick="openSection('tasks')"
    >
      <span>▣</span>
      <small>Tasks</small>
    </button>


    <button
      class="nav-item"
      data-page="friends"
      onclick="openSection('friends')"
    >
      <span>♧</span>
      <small>Friends</small>
    </button>


    <button
      class="nav-item"
      data-page="wallet"
      onclick="openSection('wallet')"
    >
      <span>◈</span>
      <small>Wallet</small>
    </button>

  </nav>

</div>


<script src="/app.js?v=5"></script>

</body>
</html>
