<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>DzMoney</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">

      <div class="brand">
        <div class="brand-icon">💎</div>

        <div>
          <div class="brand-name">DzMoney</div>
          <div class="brand-subtitle">Earn • Complete • Withdraw</div>
        </div>
      </div>

      <button class="profile-button">
        <span>👤</span>
      </button>

    </header>


    <!-- Main -->
    <main>

      <!-- Balance Card -->
      <section class="balance-card">

        <div class="balance-top">
          <span>Total balance</span>
          <span class="online-dot">● Online</span>
        </div>

        <div class="coins">
          <span class="coin-icon">💎</span>
          <span id="coins">12,450</span>
        </div>

        <div class="balance-label">
          Coins
        </div>

        <div class="balance-divider"></div>

        <div class="mini-balances">

          <div class="mini-balance">
            <span class="mini-icon">💰</span>
            <div>
              <strong id="bux">12.5</strong>
              <small>BUX</small>
            </div>
          </div>

          <div class="mini-balance">
            <span class="mini-icon">TON</span>
            <div>
              <strong>0.00125</strong>
              <small>Estimated TON</small>
            </div>
          </div>

        </div>

      </section>


      <!-- Daily Reward -->
      <section class="daily-card">

        <div class="daily-icon">
          🎁
        </div>

        <div class="daily-content">

          <h3>Daily Reward</h3>

          <p id="daily-text">
            Your daily reward is ready!
          </p>

        </div>

        <button id="daily-button" class="claim-button">
          Claim
        </button>

      </section>


      <!-- Earn Section -->
      <div class="section-heading">

        <div>
          <h2>Earn more</h2>
          <p>Complete activities and earn rewards</p>
        </div>

      </div>


      <!-- Features -->
      <section class="features">

        <button class="feature-card" onclick="openSection('tasks')">

          <div class="feature-icon tasks-icon">
            📺
          </div>

          <div class="feature-info">
            <h3>Tasks</h3>
            <p>Watch & complete</p>
          </div>

          <span class="arrow">›</span>

        </button>


        <button class="feature-card" onclick="openSection('friends')">

          <div class="feature-icon friends-icon">
            👥
          </div>

          <div class="feature-info">
            <h3>Friends</h3>
            <p>Invite & earn</p>
          </div>

          <span class="arrow">›</span>

        </button>


        <button class="feature-card" onclick="openSection('wallet')">

          <div class="feature-icon wallet-icon">
            💳
          </div>

          <div class="feature-info">
            <h3>Wallet</h3>
            <p>Withdraw BUX</p>
          </div>

          <span class="arrow">›</span>

        </button>


        <button class="feature-card coming-soon">

          <div class="feature-icon investment-icon">
            🚀
          </div>

          <div class="feature-info">
            <h3>Investment</h3>
            <p>Coming soon</p>
          </div>

          <span class="soon-badge">SOON</span>

        </button>

      </section>


      <!-- Withdraw information -->
      <section class="info-card">

        <div class="info-icon">
          💰
        </div>

        <div>
          <strong>BUX withdrawals</strong>

          <p>
            Minimum withdrawal
            <b>2,000 BUX</b>
            = 0.2 TON
          </p>
        </div>

      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

      <button class="nav-item active" onclick="openSection('home')">
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button class="nav-item" onclick="openSection('tasks')">
        <span>▣</span>
        <small>Tasks</small>
      </button>

      <button class="nav-item" onclick="openSection('friends')">
        <span>♧</span>
        <small>Friends</small>
      </button>

      <button class="nav-item" onclick="openSection('wallet')">
        <span>◈</span>
        <small>Wallet</small>
      </button>

    </nav>

  </div>


  <script src="/app.js"></script>

</body>
</html>
