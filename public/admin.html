<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DzMoney Admin</title>
<style>
:root{color-scheme:dark;--bg:#07121f;--card:#101e2e;--muted:#8fa2b8;--accent:#53e0b0;--danger:#ff6b6b;--line:#223247;--blue:#173044}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#06101c,#0a1827);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f7fb}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:rgba(16,30,46,.96);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 10px 35px #0004}
h1,h2,h3{margin-top:0}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{padding:18px;border-radius:16px;background:#0c1928;border:1px solid var(--line)}
.stat b{font-size:27px;display:block;margin-top:5px}
input,textarea,select,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 13px;background:#091522;color:#fff}
input,textarea,select{width:100%}
button{cursor:pointer;background:#173044}
button.primary{background:#18a978;border-color:#18a978;color:#06140f;font-weight:700}
button.danger{background:#4a1d26;border-color:#6d2834;color:#ffb7b7}
button.warn{background:#4a3b19;border-color:#725a25;color:#ffe7a1}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tabs button.active{background:#18a978;color:#06140f}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.scroll{overflow:auto}.hidden{display:none}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#173044}
.ok{color:var(--accent)}.bad{color:#ff8e8e}.small{font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.detail-box{background:#0c1928;border:1px solid var(--line);padding:14px;border-radius:14px}
.detail-box b{display:block;font-size:22px;margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal .card{width:min(760px,100%);margin:20px 0}
.close{float:right}
code{color:#9ee9cf}
@media(max-width:600px){.wrap{padding:12px}.card{padding:15px}th,td{font-size:13px}.actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card">
    <h1>DzMoney Admin</h1>
    <p class="muted">Secure owner panel</p>
    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
    <button class="primary" style="width:100%;margin-top:10px" onclick="login()">Login</button>
    <p id="loginMsg" class="bad"></p>
  </section>

  <main id="app" class="hidden">
    <div class="actions" style="justify-content:space-between;align-items:center">
      <div><h1>DzMoney Admin</h1><div class="muted">Owner controls</div></div>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
      <button class="active" onclick="tab('overview',this)">Overview</button>
      <button onclick="tab('users',this)">Users</button>
      <button onclick="tab('tasks',this)">Tasks</button>
      <button onclick="tab('settings',this)">Settings</button>
      <button onclick="tab('audit',this)">Audit</button>
    </div>

    <section id="overview" class="page">
      <div id="stats" class="grid"></div>
      <div class="card"><h2>Recent admin actions</h2><div id="recent" class="scroll"></div></div>
    </section>

    <section id="users" class="page hidden">
      <div class="card">
        <div class="section-title">
          <div><h2>Users</h2><div class="muted small">Search, inspect and control user accounts.</div></div>
          <button onclick="loadUsers()">Refresh</button>
        </div>
        <div class="row">
          <input id="userSearch" placeholder="Search Telegram/user ID">
          <select id="userLimit"><option>25</option><option selected>50</option><option>100</option></select>
          <button class="primary" onclick="loadUsers()">Search</button>
        </div>
        <div id="usersTable" class="scroll"></div>
      </div>
    </section>

    <section id="tasks" class="page hidden">
      <div class="card">
        <h2>Tasks</h2>
        <div id="tasksList"></div>
      </div>
      <div class="card">
        <h2>Create task</h2>
        <div class="row">
          <input id="newId" placeholder="ID e.g. survey">
          <input id="newTitle" placeholder="Title">
          <input id="newReward" type="number" min="0" placeholder="BUX reward">
          <input id="newDuration" type="number" min="0" placeholder="Duration seconds">
          <input id="newIcon" placeholder="Icon">
          <input id="newDesc" placeholder="Description">
        </div>
        <button class="primary" onclick="createTask()">Create</button>
      </div>
    </section>

    <section id="settings" class="page hidden">
      <div class="card"><h2>App settings</h2><div id="settingsForm"></div><button class="primary" onclick="saveSettings()">Save settings</button></div>
    </section>

    <section id="audit" class="page hidden">
      <div class="card"><h2>Audit log</h2><div id="auditTable" class="scroll"></div></div>
    </section>
  </main>
</div>

<div id="userModal" class="modal hidden" onclick="if(event.target===this)closeUser()">
  <div class="card">
    <button class="close" onclick="closeUser()">✕</button>
    <h2>User details</h2>
    <div id="userDetails"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

async function api(url,opt={}){
  const r=await fetch(url,{
    credentials:"same-origin",
    headers:{"Content-Type":"application/json",...(opt.headers||{})},
    ...opt
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||"Request failed");
  return d;
}

async function login(){
  try{
    await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    loadAll();
  }catch(e){$("loginMsg").textContent=e.message}
}

async function logout(){
  await api("/api/admin/logout",{method:"POST"}).catch(()=>{});
  location.reload();
}

async function loadAll(){
  await Promise.allSettled([loadStats(),loadUsers(),loadTasks(),loadSettings(),loadAudit()]);
}

function tab(id,btn){
  document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
  $(id).classList.remove("hidden");
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function table(head,rows){
  return `<table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")
  }</tbody></table>`;
}

async function loadStats(){
  try{
    const d=await api("/api/admin/stats"),s=d.stats;
    $("stats").innerHTML=[
      ["Users",s.users],["Banned",s.bannedUsers],["Total BUX",s.totalBux],
      ["Total Coins",s.totalCoins],["Active tasks",s.activeTasks],["Task claims",s.totalClaims]
    ].map(x=>`<div class="stat"><span class="muted">${esc(x[0])}</span><b>${Number(x[1]).toLocaleString()}</b></div>`).join("");
    $("recent").innerHTML=table(["Action","Target","Details","Time"],
      d.recentActions.map(x=>[esc(x.action),esc(x.target_id||""),esc(x.details),esc(new Date(Number(x.created_at)).toLocaleString())]));
  }catch(e){console.error(e)}
}

async function loadUsers(){
  try{
    const q=encodeURIComponent($("userSearch").value.trim());
    const limit=encodeURIComponent($("userLimit").value);
    const d=await api(`/api/admin/users?q=${q}&limit=${limit}`);
    $("usersTable").innerHTML=d.users.length?table(
      ["ID","BUX","Coins","TON","Status","Created","Actions"],
      d.users.map(u=>[
        `<code>${esc(u.id)}</code>`,
        Number(u.bux).toLocaleString(),
        Number(u.coins).toLocaleString(),
        Number(u.ton).toFixed(6),
        u.isBanned?`<span class="bad">BANNED</span>`:`<span class="ok">ACTIVE</span>`,
        esc(new Date(Number(u.createdAt||0)).toLocaleDateString()),
        `<div class="actions">
          <button onclick="openUser('${esc(u.id)}')">Details</button>
          <button onclick="changeBalance('${esc(u.id)}')">Delta</button>
          <button class="${u.isBanned?"":"danger"}" onclick="ban('${esc(u.id)}',${!u.isBanned})">${u.isBanned?"Unban":"Ban"}</button>
        </div>`
      ])
    ):`<p class="muted">No users found.</p>`;
  }catch(e){$("usersTable").innerHTML=`<p class="bad">${esc(e.message)}</p>`}
}

async function openUser(id){
  $("userModal").classList.remove("hidden");
  $("userDetails").innerHTML=`<p class="muted">Loading ${esc(id)}...</p>`;
  try{
    const d=await api("/api/admin/users/"+encodeURIComponent(id));
    const u=d.user;
    $("userDetails").innerHTML=`
      <div class="detail-grid">
        <div class="detail-box"><span class="muted">User ID</span><b style="font-size:15px;word-break:break-all">${esc(u.id)}</b></div>
        <div class="detail-box"><span class="muted">BUX</span><b>${Number(u.bux).toLocaleString()}</b></div>
        <div class="detail-box"><span class="muted">Coins</span><b>${Number(u.coins).toLocaleString()}</b></div>
        <div class="detail-box"><span class="muted">TON estimate</span><b>${Number(u.ton).toFixed(6)}</b></div>
        <div class="detail-box"><span class="muted">Status</span><b>${u.isBanned?"BANNED":"ACTIVE"}</b></div>
        <div class="detail-box"><span class="muted">Daily claim</span><b style="font-size:15px">${u.dailyClaimAt?esc(new Date(Number(u.dailyClaimAt)).toLocaleString()):"Available"}</b></div>
      </div>

      <div class="card">
        <h3>Set exact balance</h3>
        <div class="row">
          <label class="muted">BUX<input id="exactBux" type="number" min="0" value="${Number(u.bux)}"></label>
          <label class="muted">Coins<input id="exactCoins" type="number" min="0" value="${Number(u.coins)}"></label>
        </div>
        <button class="primary" onclick="setBalance('${esc(u.id)}')">Save balance</button>
      </div>

      <div class="card">
        <h3>Account controls</h3>
        <div class="actions">
          <button class="warn" onclick="resetDaily('${esc(u.id)}')">Reset daily reward</button>
          <button class="warn" onclick="resetProgress('${esc(u.id)}')">Reset task progress</button>
          <button class="${u.isBanned?"":"danger"}" onclick="banFromModal('${esc(u.id)}',${!u.isBanned})">${u.isBanned?"Unban user":"Ban user"}</button>
        </div>
        <p class="muted small">Reset task progress removes this user's task-claim history and resets the daily reward timer. It does not change the balance.</p>
      </div>

      <div class="card">
        <h3>Task claim history</h3>
        ${d.claims.length?table(["Task","Reward","Claimed"],d.claims.map(c=>[
          esc(c.title),Number(c.reward).toLocaleString()+" BUX",esc(new Date(Number(c.claimedAt)).toLocaleString())
        ])):`<p class="muted">No task claims.</p>`}
      </div>`;
  }catch(e){$("userDetails").innerHTML=`<p class="bad">${esc(e.message)}</p>`}
}

function closeUser(){$("userModal").classList.add("hidden")}

async function changeBalance(id){
  const b=prompt("BUX delta (+add, -remove):","0"); if(b===null)return;
  const c=prompt("Coins delta (+add, -remove):","0"); if(c===null)return;
  if(!Number.isInteger(Number(b))||!Number.isInteger(Number(c)))return alert("Use whole numbers.");
  try{
    await api("/api/admin/users/"+encodeURIComponent(id)+"/balance",{
      method:"POST",body:JSON.stringify({buxDelta:Number(b),coinsDelta:Number(c)})
    });
    await loadUsers(); await loadStats(); alert("Balance updated.");
  }catch(e){alert(e.message)}
}

async function setBalance(id){
  const bux=Number($("exactBux").value),coins=Number($("exactCoins").value);
  if(!Number.isInteger(bux)||!Number.isInteger(coins)||bux<0||coins<0)return alert("Use non-negative whole numbers.");
  if(!confirm("Set this user's exact balance?"))return;
  try{
    await api("/api/admin/users/"+encodeURIComponent(id)+"/balance",{
      method:"PUT",body:JSON.stringify({bux,coins})
    });
    await loadUsers(); await loadStats(); await openUser(id);
    alert("Exact balance saved.");
  }catch(e){alert(e.message)}
}

async function ban(id,banned){
  if(!confirm((banned?"Ban ":"Unban ")+id+"?"))return;
  try{
    await api("/api/admin/users/"+encodeURIComponent(id)+"/ban",{method:"POST",body:JSON.stringify({banned})});
    await loadUsers(); await loadStats();
  }catch(e){alert(e.message)}
}

async function banFromModal(id,banned){
  await ban(id,banned);
  await openUser(id);
}

async function resetDaily(id){
  if(!confirm("Reset this user's daily reward timer?"))return;
  try{
    await api("/api/admin/users/"+encodeURIComponent(id)+"/reset-daily",{method:"POST",body:"{}"});
    await openUser(id); await loadStats();
    alert("Daily reward reset.");
  }catch(e){alert(e.message)}
}

async function resetProgress(id){
  if(!confirm("Reset task progress for this user? This removes all task claims and resets daily reward. Balance will stay unchanged."))return;
  try{
    await api("/api/admin/users/"+encodeURIComponent(id)+"/reset-progress",{method:"POST",body:"{}"});
    await openUser(id); await loadStats();
    alert("User progress reset.");
  }catch(e){alert(e.message)}
}

async function loadTasks(){
  try{
    const d=await api("/api/admin/tasks");
    $("tasksList").innerHTML=d.tasks.map(t=>`
      <div class="card">
        <div class="row">
          <input id="t_title_${esc(t.id)}" value="${esc(t.title)}">
          <input id="t_reward_${esc(t.id)}" type="number" min="0" value="${t.reward}">
          <input id="t_duration_${esc(t.id)}" type="number" min="0" value="${t.duration}">
          <input id="t_icon_${esc(t.id)}" value="${esc(t.icon)}">
        </div>
        <textarea id="t_desc_${esc(t.id)}">${esc(t.description)}</textarea>
        <div class="actions" style="margin-top:8px">
          <label><input style="width:auto" id="t_active_${esc(t.id)}" type="checkbox" ${t.active?"checked":""}> Active</label>
          <label><input style="width:auto" id="t_repeat_${esc(t.id)}" type="checkbox" ${t.repeatable?"checked":""}> Repeatable</label>
          <button class="primary" onclick="saveTask('${esc(t.id)}')">Save</button>
          <button class="danger" onclick="deleteTask('${esc(t.id)}')">Delete</button>
        </div>
      </div>`).join("");
  }catch(e){$("tasksList").innerHTML=`<p class="bad">${esc(e.message)}</p>`}
}

async function saveTask(id){
  try{
    await api("/api/admin/tasks/"+encodeURIComponent(id),{
      method:"PUT",
      body:JSON.stringify({
        title:$("t_title_"+id).value,description:$("t_desc_"+id).value,
        reward:Number($("t_reward_"+id).value),duration:Number($("t_duration_"+id).value),
        icon:$("t_icon_"+id).value,active:$("t_active_"+id).checked,repeatable:$("t_repeat_"+id).checked
      })
    });
    alert("Task saved."); loadTasks(); loadStats();
  }catch(e){alert(e.message)}
}

async function createTask(){
  try{
    await api("/api/admin/tasks",{method:"POST",body:JSON.stringify({
      id:$("newId").value,title:$("newTitle").value,description:$("newDesc").value,
      reward:Number($("newReward").value),duration:Number($("newDuration").value),
      icon:$("newIcon").value||"🎯"
    })});
    alert("Task created."); loadTasks(); loadStats();
  }catch(e){alert(e.message)}
}

async function deleteTask(id){
  if(!confirm("Delete task "+id+"? Claims linked to it will also be removed."))return;
  try{
    await api("/api/admin/tasks/"+encodeURIComponent(id),{method:"DELETE"});
    loadTasks(); loadStats();
  }catch(e){alert(e.message)}
}

async function loadSettings(){
  try{
    const d=await api("/api/admin/settings");
    $("settingsForm").innerHTML=Object.entries(d.settings).map(([k,v])=>
      `<div class="row"><label class="muted">${esc(k)}<input data-setting="${esc(k)}" value="${esc(v)}"></label></div>`
    ).join("");
  }catch(e){$("settingsForm").innerHTML=`<p class="bad">${esc(e.message)}</p>`}
}

async function saveSettings(){
  const settings={};
  document.querySelectorAll("[data-setting]").forEach(x=>settings[x.dataset.setting]=x.value);
  try{await api("/api/admin/settings",{method:"PUT",body:JSON.stringify({settings})});alert("Settings saved.");}
  catch(e){alert(e.message)}
}

async function loadAudit(){
  try{
    const d=await api("/api/admin/audit");
    $("auditTable").innerHTML=table(["Admin","Action","Target","Details","Time"],
      d.logs.map(x=>[esc(x.admin_id),esc(x.action),esc(x.target_id||""),esc(x.details),esc(new Date(Number(x.created_at)).toLocaleString())]));
  }catch(e){$("auditTable").innerHTML=`<p class="bad">${esc(e.message)}</p>`}
}

(async()=>{
  try{
    await api("/api/admin/me");
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    loadAll();
  }catch(e){}
})();
</script>
</body>
</html>
