<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131f"><title>DzMoney • Control Center</title>
<style>
:root{--bg:#07131f;--panel:#0c1c2a;--panel2:#102536;--line:#1d3547;--text:#f3faf8;--muted:#8ca6b6;--accent:#52e2b0;--danger:#ff7180;--warn:#f0c66d;--shadow:0 20px 60px #0005;--r:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#123a45,transparent 60%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{position:sticky;top:0;height:100vh;padding:20px 13px;background:#06111aeF;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#159170);color:#052019;font-weight:900;font-size:20px}.brand small{display:block;color:var(--muted);margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#9bb0bd;padding:11px 12px;border-radius:12px;text-align:left}.nav button.active,.nav button:hover{background:#102f38;color:var(--accent);border-color:#1a4c4b}.side-foot{margin-top:auto}.side-foot button{width:100%;padding:10px;border:1px solid var(--line);background:#0b1c29;color:#b8c9d2;border-radius:12px}.main{min-width:0;padding:24px clamp(12px,3vw,40px) 55px}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{margin:5px 0;color:var(--muted)}.status{border:1px solid var(--line);background:#0b1b28;padding:8px 11px;border-radius:999px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #52e2b0;margin-right:6px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:linear-gradient(145deg,#102535f2,#0a1925f2);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}.metric{min-height:115px}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.value{font-size:28px;font-weight:850;margin-top:7px}.sub{font-size:11px;color:#76d9bc;margin-top:6px}.section{margin-top:14px;padding:15px;border:1px solid var(--line);background:#091a27;border-radius:15px}.section h3{margin:0 0 4px}.section>p{margin:0 0 12px;color:var(--muted);font-size:11px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.section-head h2{margin:0;font-size:17px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#102737;color:var(--text);padding:9px 13px;border-radius:11px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#052019;font-weight:800}.btn.danger{background:#3a1820;border-color:#64303a;color:#ffb6bd}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#071621;border:1px solid #1b3344;color:var(--text);border-radius:10px;padding:10px;outline:none}.field textarea{min-height:90px}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:9px;color:#718c9d;text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#163142;color:#b8d1dc;font-size:10px}.ok{background:#0d3b31;color:#86efca}.bad{background:#3b1820;color:#ffadb6}.task{padding:13px;border:1px solid var(--line);border-radius:14px;background:#091a27;margin:9px 0}.task-top{display:flex;justify-content:space-between;gap:10px}.task-title{font-weight:800}.hint{color:var(--muted);font-size:11px;line-height:1.5}.badbox{padding:11px;border-radius:10px;color:#ffadb6;background:#321821;border:1px solid #61303a}.empty{text-align:center;color:var(--muted);padding:28px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:20}.modal-box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#0b1c29;border:1px solid var(--line);border-radius:20px;padding:20px}.close{float:right;border:0;background:transparent;color:var(--muted);font-size:24px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login-box{width:min(430px,100%);padding:26px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#102535,#091a27);box-shadow:var(--shadow)}.login-box h1{margin:0}.login-box p{color:var(--muted)}.login .field{margin:16px 0}.login .btn{width:100%}.toast{position:fixed;right:16px;bottom:16px;background:#102c35;border:1px solid #2b5c61;padding:11px 14px;border-radius:12px;z-index:50}.mobile{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.app{display:block}.side{display:none}.main{padding:15px 11px 85px}.head h1{font-size:23px}.grid,.grid2,.form{grid-template-columns:1fr}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:9px;right:9px;bottom:9px;background:#07151fee;border:1px solid var(--line);border-radius:16px;padding:5px;z-index:10}.mobile button{border:0;background:transparent;color:#849aa8;border-radius:10px;padding:7px 2px;font-size:9px}.mobile button.active{background:#102f38;color:var(--accent)}.mobile span{display:block;font-size:15px;margin-bottom:2px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-box"><div class="mark">◆</div><h1>DzMoney Control Center</h1><p>Secure owner administration • PostgreSQL-backed controls</p><div class="field"><label>ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn primary" id="loginBtn">Sign in</button><div id="loginError" class="badbox hidden" style="margin-top:12px"></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand"><div class="mark">◆</div><div><b>DzMoney</b><small>Control Center</small></div></div><nav id="nav" class="nav"></nav><div class="side-foot"><button id="logout">Sign out</button></div></aside><main class="main"><header class="head"><div><h1 id="title">Dashboard</h1><p id="subtitle">Live database overview</p></div><div class="status"><i class="dot"></i><span id="statusText">Control active</span></div></header><div id="content"></div></main></div>
<nav id="mobile" class="mobile"></nav><div id="modal" class="modal hidden"><div class="modal-box"><button id="close" class="close">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('en-US'):'0';
const nav=[['dashboard','⌂','Dashboard','Live database overview'],['users','◉','Users','Accounts and balances'],['tasks','✓','Task Catalog','Canonical task engine'],['economy','◈','Economy','Rates and withdrawal rules'],['activity','⚡','Rewards & Activity','Daily and ad rewards'],['referral','↗','Referral','One-level referral policy'],['withdrawals','⇄','Withdrawals','Review requests'],['system','⚙','System','Runtime controls'],['audit','▤','Audit Log','Admin history']];
const labels={dzx_per_ton:'DZX per TON',coins_per_dzx:'Coins per DZX',coins_per_ton:'Coins per TON (derived)',minimum_deposit_ton:'Minimum deposit (TON)',minimum_withdrawal_ton:'Minimum withdrawal (TON)',minimum_withdrawal_coins:'Minimum withdrawal (Coins)',withdrawal_fee_dzx:'Withdrawal fee (DZX)',bux_per_ton:'Legacy BUX per TON',coins_per_bux:'Legacy Coins per BUX',minimum_withdraw_bux:'Legacy minimum withdrawal (BUX)',withdrawal_fee_bux:'Legacy withdrawal fee (BUX)',daily_reward_coins:'Daily reward Coins',daily_reward_bux:'Daily reward BUX',daily_ads_limit:'Daily Ads limit',daily_ad_task_count:'Ads required for View Ads',daily_task_reward_coins:'Daily task Coins',daily_task_reward_dzx:'Daily task DZX',daily_reward_ad_separate:'Daily reward uses separate ad',dzp_default_activity:'Default activity DZP',dzp_ad_reward:'Ad reward DZP',dzp_referral_reward:'Referral reward DZP',adsgram_block_id:'AdsGram block ID',updates_channel_url:'Updates channel URL',referral_percentage:'Referral percentage',squad_activity_threshold_percent:'Squad activity threshold %',squad_max_bonus_percent:'Squad max bonus %',system_enabled:'System enabled'};
const groups={economy:['dzx_per_ton','coins_per_dzx','coins_per_ton','minimum_deposit_ton','minimum_withdrawal_ton','minimum_withdrawal_coins','withdrawal_fee_dzx'],compat:['bux_per_ton','coins_per_bux','minimum_withdraw_bux','withdrawal_fee_bux'],activity:['daily_reward_coins','daily_reward_bux','daily_ads_limit','daily_ad_task_count','daily_task_reward_coins','daily_task_reward_dzx','daily_reward_ad_separate','dzp_default_activity','dzp_ad_reward','dzp_referral_reward','adsgram_block_id','updates_channel_url'],referral:['referral_percentage'],squad:['squad_activity_threshold_percent','squad_max_bonus_percent'],system:['system_enabled']};
let settings={},page=localStorage.getItem('dz_admin_page')||'dashboard';
const api=async(url,opt={})=>{const method=String(opt.method||'GET').toUpperCase(),r=await fetch(url,{...opt,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json',...(method!=='GET'&&method!=='HEAD'?{'X-DzMoney-Admin-Request':'1'}:{}),...(opt.headers||{})}}),raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{}if(!r.ok)throw Error(d.message||raw||`HTTP ${r.status}`);return d};
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function navRender(){const html=nav.map(x=>`<button data-page="${x[0]}" class="${x[0]===page?'active':''}"><span>${x[1]}</span>${x[2]}</button>`).join('');$('nav').innerHTML=html;$('mobile').innerHTML=nav.slice(0,5).map(x=>`<button data-page="${x[0]}" class="${x[0]===page?'active':''}"><span>${x[1]}</span>${x[2].split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function head(){const x=nav.find(n=>n[0]===page)||nav[0];$('title').textContent=x[2];$('subtitle').textContent=x[3];navRender()}
async function go(p){page=p;localStorage.setItem('dz_admin_page',p);head();const f={dashboard,users,tasks,economy,activity,referral,withdrawals,system,audit}[p]||dashboard;await f()}
function metric(a,b,c=''){return `<div class="card metric"><div class="label">${esc(a)}</div><div class="value">${fmt(b)}</div>${c?`<div class="sub">${esc(c)}</div>`:''}</div>`}
async function dashboard(){try{const d=await api('/api/admin/stats'),m=d.metrics||{};$('content').innerHTML=`<div class="grid">${metric('Members',m.members)}${metric('DZX',m.totalDZX)}${metric('DZP',m.totalDZP)}${metric('Coins',m.totalCoins)}${metric('Withdrawable DZX',m.withdrawableDZX)}${metric('Active tasks',m.activeTasks)}${metric('Completions',m.totalClaims)}${metric('Confirmed ads',m.adsWatched)}${metric('Referrals',m.referrals)}${metric('Pending withdrawals',m.pendingWithdrawals)}${metric('Banned users',m.bannedUsers)}${metric('Legacy BUX',m.totalBUX)}</div><div class="card" style="margin-top:14px"><div class="section-head"><div><h2>System health</h2><p>Metrics are read directly from PostgreSQL. Missing legacy tables degrade to zero instead of NaN.</p></div><button class="btn" id="refresh">↻ Refresh</button></div><span class="pill ${m.systemEnabled?'ok':'bad'}">${m.systemEnabled?'SYSTEM ONLINE':'SYSTEM PAUSED'}</span> <span class="pill">${new Date(d.generatedAt).toLocaleTimeString()}</span></div>`;$('refresh').onclick=dashboard}catch(e){$('content').innerHTML=`<div class="card badbox">${esc(e.message)}</div>`}}
async function users(){ $('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Users</h2><p>Search, inspect and control accounts.</p></div></div><div class="form"><div class="field"><label>User ID</label><input id="uq" placeholder="Telegram ID"></div><div class="field"><label>Limit</label><select id="ul"><option>25</option><option selected>50</option><option>100</option></select></div><div class="actions" style="align-items:end"><button class="btn primary" id="us">Search</button></div></div><div id="ut" style="margin-top:14px"></div></div>`;$('us').onclick=loadUsers;await loadUsers()}
async function loadUsers(){try{const q=encodeURIComponent($('uq').value.trim()),d=await api(`/api/admin/users?q=${q}&limit=${$('ul').value}`);$('ut').innerHTML=d.users?.length?`<div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>BUX</th><th>Coins</th><th>Status</th><th></th></tr></thead><tbody>${d.users.map(u=>`<tr><td><b>${esc(u.username?'@'+u.username:(u.firstName||u.id))}</b><br><span class="hint">${esc(u.id)}</span></td><td>${fmt(u.bux)}</td><td>${fmt(u.coins)}</td><td><span class="pill ${u.isBanned?'bad':'ok'}">${u.isBanned?'BANNED':'ACTIVE'}</span></td><td><button class="btn" onclick="window.manageUser('${esc(u.id)}')">Manage</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No users found.</div>'}catch(e){$('ut').innerHTML=`<div class="badbox">${esc(e.message)}</div>`}}
window.manageUser=async id=>{try{const [d,e]=await Promise.all([api(`/api/admin/users/${encodeURIComponent(id)}`),api(`/api/admin/users/${encodeURIComponent(id)}/economy`)]),u=d.user,z=e.user||{};$('modalContent').innerHTML=`<h2>User ${esc(id)}</h2><p class="hint">${esc(u.username?'@'+u.username:(u.firstName||''))}</p><div class="grid">${metric('BUX',u.bux)}${metric('Coins',u.coins)}${metric('DZP',z.dzp)}${metric('DZX',z.dzx)}${metric('Withdrawable DZX',z.withdrawable_dzx)}${metric('Locked DZX',z.locked_dzx)}</div><div class="section"><h3>DZP control</h3><div class="form"><div class="field"><label>Exact DZP</label><input id="dzpExact" type="number" min="0" step="1" value="${Number(z.dzp||0)}"></div><div class="field"><label>DZP adjustment</label><input id="dzpDelta" type="number" step="1" value="0"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="setD">Set exact</button><button class="btn" id="addD">Apply adjustment</button></div></div><div class="section"><h3>Account</h3><div class="form"><div class="field"><label>Username</label><input id="un" value="${esc(u.username)}"></div><div class="field"><label>First name</label><input id="fn" value="${esc(u.firstName)}"></div><div class="field"><label>Last name</label><input id="ln" value="${esc(u.lastName)}"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveU">Save</button><button class="btn ${u.isBanned?'':'danger'}" id="banU">${u.isBanned?'Unban':'Ban'}</button><button class="btn danger" id="delU">Delete</button></div></div>`;$('modal').classList.remove('hidden');$('setD').onclick=async()=>{const n=Number($('dzpExact').value);if(!Number.isSafeInteger(n)||n<0)return toast('Invalid DZP');await api(`/api/admin/users/${encodeURIComponent(id)}/balance`,{method:'PUT',body:JSON.stringify({dzp:n})});toast('DZP updated')};$('addD').onclick=async()=>{const n=Number($('dzpDelta').value);if(!Number.isSafeInteger(n))return toast('Invalid adjustment');await api(`/api/admin/users/${encodeURIComponent(id)}/balance`,{method:'POST',body:JSON.stringify({dzpDelta:n})});toast('DZP updated')};$('saveU').onclick=async()=>{await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify({username:$('un').value,firstName:$('fn').value,lastName:$('ln').value,isBanned:u.isBanned})});toast('User saved')};$('banU').onclick=async()=>{await api(`/api/admin/users/${encodeURIComponent(id)}/ban`,{method:'POST',body:JSON.stringify({banned:!u.isBanned})});toast('Status changed');$('modal').classList.add('hidden');users()};$('delU').onclick=async()=>{if(prompt('Type DELETE to confirm')!=='DELETE')return;await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'DELETE'});toast('User deleted');$('modal').classList.add('hidden');users()} }catch(e){$('modalContent').innerHTML=`<div class="badbox">${esc(e.message)}</div>`;$('modal').classList.remove('hidden')}};
async function tasks(){try{const d=await api('/api/admin/tasks');$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Canonical Task Catalog</h2><p>The same task records are consumed by the v2 task engine.</p></div><button class="btn primary" id="newT">+ New task</button></div><div id="tl"></div></div>`;$('newT').onclick=()=>editTask();renderTasks(d.tasks||[])}catch(e){$('content').innerHTML=`<div class="card badbox">${esc(e.message)}</div>`}}
function renderTasks(ts){$('tl').innerHTML=ts.length?ts.map(t=>`<div class="task"><div class="task-top"><div><b>${esc(t.title)}</b><div class="hint">${esc(t.id)} • ${esc(t.type)} • ${esc(t.verificationMethod)}</div></div><span class="pill ${t.active?'ok':'bad'}">${t.active?'ACTIVE':'OFF'}</span></div><div class="actions" style="margin-top:9px"><span class="pill">Coins +${fmt(t.rewardCoins)}</span><span class="pill">DZP +${fmt(t.rewardDZP)}</span><span class="pill">DZX +${fmt(t.rewardDZX)}</span><span class="pill">Cooldown ${fmt(t.cadenceSeconds||0)}s</span><button class="btn" onclick='window.editTask(${JSON.stringify(t)})'>Edit</button><button class="btn danger" onclick='window.delTask(${JSON.stringify(t.id)})'>Delete</button></div></div>`).join(''):'<div class="empty">No tasks.</div>'}
window.delTask=async id=>{if(!confirm('Delete this task?'))return;await api(`/api/admin/tasks/${encodeURIComponent(id)}`,{method:'DELETE'});toast('Task deleted');tasks()};window.editTask=t=>editTask(t);
function editTask(t={}){$('modalContent').innerHTML=`<h2>${t.id?'Edit':'Create'} task</h2><div class="form"><div class="field"><label>ID</label><input id="tid" value="${esc(t.id||'')}" ${t.id?'readonly':''}></div><div class="field"><label>Category</label><select id="tt">${['daily','game','social','web','special','partner'].map(x=>`<option ${x===t.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Verification</label><select id="tv">${['server_checkin','adsgram_reward','telegram_channel','referral_count','external_url','manual_review','timer','none'].map(x=>`<option ${x===t.verificationMethod?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="ttitle" value="${esc(t.title||'')}"></div><div class="field"><label>Coins reward</label><input id="tc" type="number" min="0" value="${Number(t.rewardCoins||0)}"></div><div class="field"><label>DZP reward</label><input id="tp" type="number" min="0" step="0.000001" value="${Number(t.rewardDZP||0)}"></div><div class="field"><label>DZX reward</label><input id="tx" type="number" min="0" step="0.000001" value="${Number(t.rewardDZX||0)}"></div><div class="field"><label>Economic budget DZX</label><input id="tb" type="number" min="0" step="0.000001" value="${Number(t.economicBudgetDZX||t.rewardDZX||0)}"></div><div class="field"><label>Required count</label><input id="tr" type="number" min="1" value="${Number(t.requiredCount||1)}"></div><div class="field"><label>Cooldown seconds</label><input id="tcd" type="number" min="0" value="${t.cadenceSeconds??0}"></div><div class="field"><label>Active</label><select id="ta"><option value="true" ${t.active!==false?'selected':''}>Active</option><option value="false" ${t.active===false?'selected':''}>Off</option></select></div><div class="field"><label>Description</label><textarea id="td">${esc(t.description||'')}</textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveT">Save task</button></div>`;$('modal').classList.remove('hidden');$('saveT').onclick=async()=>{const b={id:$('tid').value,type:$('tt').value,verificationMethod:$('tv').value,title:$('ttitle').value,description:$('td').value,rewardCoins:Number($('tc').value),rewardDZP:Number($('tp').value),rewardDZX:Number($('tx').value),economicBudgetDZX:Number($('tb').value),requiredCount:Number($('tr').value),cadenceSeconds:Number($('tcd').value),active:$('ta').value==='true'};await api(t.id?`/api/admin/tasks/${encodeURIComponent(t.id)}`:'/api/admin/tasks',{method:t.id?'PUT':'POST',body:JSON.stringify(b)});toast('Task saved');$('modal').classList.add('hidden');tasks()}}
async function loadSettings(){settings=(await api('/api/admin/settings')).settings||{};return settings}
function sf(k){const v=settings[k]??'',bool=['true','false'].includes(String(v).toLowerCase());return `<div class="field"><label>${esc(labels[k]||k)}</label>${bool?`<select data-s="${k}"><option value="true" ${String(v).toLowerCase()==='true'?'selected':''}>true</option><option value="false" ${String(v).toLowerCase()==='false'?'selected':''}>false</option></select>`:`<input data-s="${k}" value="${esc(v)}" ${k==='coins_per_ton'?'readonly':''}>`}</div>`}
function sg(title,desc,keys){return `<div class="section"><h3>${esc(title)}</h3><p>${esc(desc)}</p><div class="form">${keys.map(sf).join('')}</div></div>`}
async function saveKeys(keys){const payload={};keys.forEach(k=>payload[k]=document.querySelector(`[data-s="${k}"]`)?.value??settings[k]);await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({settings:payload})});toast('Saved to PostgreSQL');await loadSettings()}
async function economy(){await loadSettings();$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Economy</h2><p>Canonical DZX economy plus safe legacy compatibility.</p></div><button class="btn primary" id="se">Save economy</button></div>${sg('Primary rates','COIN/TON is derived automatically.',groups.economy)}${sg('Compatibility','Legacy values mirror the canonical rates during migration.',groups.compat)}</div>`;$('se').onclick=()=>saveKeys([...groups.economy,...groups.compat])}
async function activity(){await loadSettings();$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Rewards & Activity</h2><p>Every reward/count value is stored in PostgreSQL or the canonical task catalog.</p></div><button class="btn primary" id="sa">Save activity</button></div>${sg('Daily, Ads & DZP','Defaults and AdsGram configuration.',groups.activity)}</div>`;$('sa').onclick=()=>saveKeys(groups.activity)}
async function referral(){await loadSettings();$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Referral</h2><p>One level only. Referral reward is independent from Squad.</p></div><button class="btn primary" id="sr">Save referral</button></div>${sg('Referral percentage','Applied to base activity reward only.',groups.referral)}<div class="section"><h3>Policy</h3><p>Level 1 • qualification after the referred user completes at least one qualifying task • lifetime referral relationship.</p></div></div>`;$('sr').onclick=()=>saveKeys(groups.referral)}
async function system(){await loadSettings();const on=String(settings.system_enabled||'true')==='true';$('content').innerHTML=`<div class="grid2"><div class="card"><div class="section-head"><div><h2>Runtime switch</h2><p>Pause user activity without disabling Admin.</p></div><span class="pill ${on?'ok':'bad'}">${on?'ONLINE':'PAUSED'}</span></div><div class="actions"><button class="btn danger" id="pause">Pause</button><button class="btn primary" id="resume">Resume</button></div></div><div class="card">${sg('Squad policy','Activity threshold and maximum bonus.',groups.squad)}</div></div><div class="card" style="margin-top:14px">${sg('System flag','Authoritative runtime switch.',groups.system)}<button class="btn primary" id="ss">Save system</button></div>`;$('pause').onclick=()=>saveDirect({system_enabled:'false'});$('resume').onclick=()=>saveDirect({system_enabled:'true'});$('ss').onclick=()=>saveKeys(groups.system)}
async function saveDirect(obj){await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({settings:obj})});toast('System setting saved');system()}
async function withdrawals(){try{const d=await api('/api/admin/withdrawals'),w=d.withdrawals||[];$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Withdrawals</h2><p>Existing withdrawal workflow remains authoritative.</p></div><button class="btn" id="wr">Refresh</button></div>${w.length?`<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Net</th><th>Status</th><th>Action</th></tr></thead><tbody>${w.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.username?'@'+x.username:(x.firstName||x.userId))}<br><span class="hint">${esc(x.userId)}</span></td><td>${fmt(x.amountBux)} BUX</td><td>${fmt(x.netBux)} BUX</td><td><span class="pill">${esc(x.status)}</span></td><td>${['pending','approved'].includes(String(x.status))?`<button class="btn primary" onclick="window.setW(${x.id},'approved')">Approve</button> <button class="btn danger" onclick="window.setW(${x.id},'rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No requests.</div>'}</div>`;$('wr').onclick=withdrawals}catch(e){$('content').innerHTML=`<div class="card badbox">${esc(e.message)}</div>`}}
window.setW=async(id,status)=>{await api(`/api/admin/withdrawals/${id}`,{method:'PUT',body:JSON.stringify({status,adminNote:''})});toast('Withdrawal updated');withdrawals()};
async function referralList(){try{const d=await api('/api/admin/referrals'),r=d.referrals||[];$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Referral Network</h2><p>Independent one-level referral relationships.</p></div><button class="btn" id="rf">Refresh</button></div>${r.length?`<div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Code</th><th>Referrer</th><th>Earnings</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.username?'@'+x.username:(x.firstName||x.id))}</td><td>${esc(x.referralCode||'—')}</td><td>${esc(x.referredBy||'—')}</td><td>${fmt(x.earningsBux)} BUX / ${fmt(x.earningsCoins)} Coins</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No referrals.</div>'}</div>`;$('rf').onclick=referralList}catch(e){$('content').innerHTML=`<div class="card badbox">${esc(e.message)}</div>`}}
async function audit(){try{const d=await api('/api/admin/audit');$('content').innerHTML=`<div class="card"><div class="section-head"><div><h2>Audit Log</h2><p>Administrative changes are recorded with timestamps.</p></div><button class="btn" id="ar">Refresh</button></div>${d.logs?.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${d.logs.map(x=>`<tr><td>${new Date(Number(x.created_at)).toLocaleString()}</td><td>${esc(x.admin_id)}</td><td>${esc(x.action)}</td><td>${esc(x.target_id||'')}</td><td>${esc(x.details||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No records.</div>'}</div>`;$('ar').onclick=audit}catch(e){$('content').innerHTML=`<div class="card badbox">${esc(e.message)}</div>`}}
const route={dashboard,users,tasks,economy,activity,referral:referralList,withdrawals,system,audit};
$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('dz_admin_page');location.reload()};
async function boot(){try{await api('/api/admin/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');await go(page)}catch{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('loginError').classList.add('hidden');await boot()}catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden')}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};boot();
})();
</script>
</body></html>
