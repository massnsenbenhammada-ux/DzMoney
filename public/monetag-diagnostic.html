<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DzMoney Monetag Diagnostic</title>
  <style>body{font-family:Arial,sans-serif;background:#0b1110;color:#fff;padding:20px;line-height:1.5}pre{white-space:pre-wrap;word-break:break-word;background:#111a18;padding:14px;border-radius:12px}button{padding:12px 16px;border:0;border-radius:10px;margin:8px 0;width:100%}</style>
</head>
<body>
  <h2>Monetag SDK Diagnostic</h2>
  <p>This test checks the real Monetag URL from inside the Telegram WebView.</p>
  <pre id="result">Ready.</pre>
  <button id="run">Run libtl.com Network Test</button>
  <button id="ad" disabled>Test Real show_11627577()</button>
<script>
const out=document.getElementById('result'),runButton=document.getElementById('run'),adButton=document.getElementById('ad');
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const URL='https://libtl.com/sdk.js',started=performance.now();
function resources(){return performance.getEntriesByName(URL).map(x=>({name:x.name,initiatorType:x.initiatorType,duration:Math.round(x.duration),transferSize:x.transferSize,encodedBodySize:x.encodedBodySize,decodedBodySize:x.decodedBodySize,responseStatus:x.responseStatus??null}));}
async function networkTest(){const t=performance.now();try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),10000);const r=await fetch(URL+'?dzmoney_test='+Date.now(),{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',signal:c.signal});clearTimeout(timer);const text=await r.text();return {ok:r.ok,status:r.status,statusText:r.statusText,contentType:r.headers.get('content-type'),contentLength:r.headers.get('content-length'),bodyLength:text.length,bodyPrefix:text.slice(0,120),durationMs:Math.round(performance.now()-t)};}catch(e){return {ok:false,errorName:e?.name||'Error',errorMessage:String(e?.message||e),durationMs:Math.round(performance.now()-t)};}}
function snapshot(){const api=window.show_11627577;return {url:URL,show11627577Type:typeof api,show11627577Present:typeof api==='function',telegramPlatform:tg?.platform??'unknown',telegramVersion:tg?.version??'unknown',readyState:document.readyState,elapsedMs:Math.round(performance.now()-started),sdkResources:resources(),userAgent:navigator.userAgent};}
function render(extra={}){out.textContent=JSON.stringify({snapshot:snapshot(),...extra},null,2);adButton.disabled=typeof window.show_11627577!=='function';}
runButton.onclick=async()=>{runButton.disabled=true;render({status:'Testing direct network access to https://libtl.com/sdk.js …'});const result=await networkTest();render({status:'Network test complete',directFetch:result});runButton.disabled=false;};
adButton.onclick=async()=>{adButton.disabled=true;const api=window.show_11627577;try{const result=await api({ymid:'diagnostic-'+Date.now(),requestVar:'diagnostic'});render({status:'Advertisement completed',adResult:result});}catch(e){render({status:'Real SDK advertisement call failed',errorName:e?.name||'Error',errorMessage:String(e?.message||e)});}finally{adButton.disabled=typeof window.show_11627577!=='function';}};
render({status:'Ready. Press Run libtl.com Network Test.'});
</script>
</body>
</html>
