<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DzMoney Monetag Diagnostic</title>
  <script>
    window.__dzMonetag = { startedAt: performance.now(), scriptLoaded: false, scriptError: false };
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="11627577" data-sdk="show_11627577"
    onload="window.__dzMonetag.scriptLoaded=true;window.__dzMonetag.scriptLoadedAt=performance.now();"
    onerror="window.__dzMonetag.scriptError=true;window.__dzMonetag.scriptErrorAt=performance.now();"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#0b1110;color:#fff;padding:20px;line-height:1.5}
    pre{white-space:pre-wrap;word-break:break-word;background:#111a18;padding:14px;border-radius:12px}
    button{padding:12px 16px;border:0;border-radius:10px;margin-top:10px;width:100%}
  </style>
</head>
<body>
  <h2>Monetag SDK Diagnostic</h2>
  <p>Run the diagnostic once. It does not claim a reward.</p>
  <pre id="result">Checking…</pre>
  <button id="run">Run SDK Test</button>
  <button id="ad" disabled>Test Rewarded Interstitial</button>
  <script>
    const out=document.getElementById('result');
    const runButton=document.getElementById('run');
    const adButton=document.getElementById('ad');
    const tg=window.Telegram?.WebApp;
    if(tg){tg.ready();tg.expand();}
    const started=performance.now();

    function sdkResourceSnapshot(){
      return performance.getEntriesByName('https://libtl.com/sdk.js').map(x=>({
        name:x.name,
        duration:Math.round(x.duration),
        transferSize:x.transferSize,
        encodedBodySize:x.encodedBodySize,
        decodedBodySize:x.decodedBodySize
      }));
    }

    function snapshot(){
      const state=window.__dzMonetag || {};
      return {
        sdkScriptLoaded:state.scriptLoaded ?? false,
        sdkScriptError:state.scriptError ?? false,
        scriptLoadedMs:state.scriptLoadedAt == null ? null : Math.round(state.scriptLoadedAt-state.startedAt),
        scriptErrorMs:state.scriptErrorAt == null ? null : Math.round(state.scriptErrorAt-state.startedAt),
        apiType:typeof window.show_11627577,
        apiReady:typeof window.show_11627577 === 'function',
        telegramPlatform:tg?.platform ?? 'unknown',
        telegramVersion:tg?.version ?? 'unknown',
        readyState:document.readyState,
        elapsedMs:Math.round(performance.now()-started),
        userAgent:navigator.userAgent,
        sdkResources:sdkResourceSnapshot()
      };
    }

    function render(extra={}){
      out.textContent=JSON.stringify({...snapshot(),...extra},null,2);
      adButton.disabled=typeof window.show_11627577!=='function';
    }

    async function probeSdkUrl(){
      const result={};
      try{
        const response=await fetch('https://libtl.com/sdk.js',{cache:'no-store',credentials:'omit'});
        result.fetchOk=response.ok;
        result.fetchStatus=response.status;
        result.fetchStatusText=response.statusText;
        result.fetchContentType=response.headers.get('content-type');
        const text=await response.text();
        result.fetchBodyLength=text.length;
        result.fetchBodyPrefix=text.slice(0,120);
      }catch(error){
        result.fetchError=String(error?.message||error);
        result.fetchErrorName=error?.name||null;
      }
      return result;
    }

    async function runDiagnostic(){
      runButton.disabled=true;
      render({phase:'script-and-global-check'});
      await new Promise(resolve=>setTimeout(resolve,1000));
      const globalBefore=typeof window.show_11627577;
      const networkProbe=await probeSdkUrl();
      render({phase:'completed',globalBefore,networkProbe});
      runButton.disabled=false;
    }

    runButton.addEventListener('click',runDiagnostic);

    adButton.addEventListener('click',async()=>{
      adButton.disabled=true;
      render({phase:'rewarded-interstitial-starting'});
      try{
        const ymid='diagnostic-'+Date.now();
        const adResult=await window.show_11627577({ymid,requestVar:'diagnostic'});
        render({phase:'rewarded-interstitial-finished',adResult});
      }catch(error){
        render({phase:'rewarded-interstitial-failed',adError:String(error?.message||error),adErrorName:error?.name||null});
      }finally{
        adButton.disabled=typeof window.show_11627577!=='function';
      }
    });

    const timer=setInterval(()=>{
      render({phase:'waiting-for-sdk'});
      if(typeof window.show_11627577==='function' || performance.now()-started>30000) clearInterval(timer);
    },1000);

    render({phase:'initial'});
  </script>
</body>
</html>
