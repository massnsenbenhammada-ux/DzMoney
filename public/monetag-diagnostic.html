<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DzMoney Monetag Diagnostic</title>
  <script>
    window.__dzMonetag = {
      startedAt: performance.now(),
      scriptLoaded: false,
      scriptError: false,
      events: [],
      fetch: null,
      unhandled: null,
      globalErrors: []
    };
    window.addEventListener('error', event => {
      window.__dzMonetag.globalErrors.push({
        message: event.message || 'window error',
        source: event.filename || null,
        line: event.lineno || null,
        column: event.colno || null
      });
    });
    window.addEventListener('unhandledrejection', event => {
      window.__dzMonetag.unhandled = String(event.reason?.message || event.reason || 'unhandled rejection');
    });
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script id="monetagSdkScript" src="https://libtl.com/sdk.js" data-zone="11627577" data-sdk="show_11627577"
    onload="window.__dzMonetag.scriptLoaded=true;window.__dzMonetag.scriptLoadedAt=performance.now();window.__dzMonetag.events.push('sdk script load event');"
    onerror="window.__dzMonetag.scriptError=true;window.__dzMonetag.scriptErrorAt=performance.now();window.__dzMonetag.events.push('sdk script error event');"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#0b1110;color:#fff;padding:20px;line-height:1.5}
    pre{white-space:pre-wrap;word-break:break-word;background:#111a18;padding:14px;border-radius:12px}
    button{padding:12px 16px;border:0;border-radius:10px;margin:8px 0;width:100%}
  </style>
</head>
<body>
  <h2>Monetag SDK Diagnostic</h2>
  <p>This checks the real <b>window.show_11627577</b> object, not the DzMoney adapter.</p>
  <pre id="result">Checking…</pre>
  <button id="run">Run Full SDK Test</button>
  <button id="ad" disabled>Test Real show_11627577()</button>
  <script>
    const out=document.getElementById('result');
    const runButton=document.getElementById('run');
    const adButton=document.getElementById('ad');
    const tg=window.Telegram?.WebApp;
    if(tg){tg.ready();tg.expand();}
    const started=performance.now();
    const sdkScript=document.getElementById('monetagSdkScript');

    function sdkResourceSnapshot(){
      return performance.getEntriesByName('https://libtl.com/sdk.js').map(x=>({
        name:x.name,
        initiatorType:x.initiatorType,
        duration:Math.round(x.duration),
        transferSize:x.transferSize,
        encodedBodySize:x.encodedBodySize,
        decodedBodySize:x.decodedBodySize,
        responseStatus:x.responseStatus ?? null
      }));
    }

    async function probeSdkUrl(){
      const startedAt=performance.now();
      try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),10000);
        const response=await fetch('https://libtl.com/sdk.js?dzmoney_diagnostic='+Date.now(),{
          method:'GET',mode:'cors',cache:'no-store',credentials:'omit',signal:controller.signal
        });
        clearTimeout(timeout);
        const text=await response.text();
        return {
          ok:response.ok,
          status:response.status,
          statusText:response.statusText,
          contentType:response.headers.get('content-type'),
          contentLength:response.headers.get('content-length'),
          bodyLength:text.length,
          bodyPrefix:text.slice(0,120),
          durationMs:Math.round(performance.now()-startedAt)
        };
      }catch(error){
        return {
          ok:false,
          errorName:error?.name||'Error',
          errorMessage:String(error?.message||error),
          durationMs:Math.round(performance.now()-startedAt)
        };
      }
    }

    function snapshot(){
      const state=window.__dzMonetag||{};
      const api=window.show_11627577;
      return {
        sdkScriptPresent:Boolean(sdkScript),
        sdkScriptSrc:sdkScript?.src||null,
        sdkScriptComplete:Boolean(sdkScript?.complete),
        sdkScriptLoadedEvent:state.scriptLoaded??false,
        sdkScriptErrorEvent:state.scriptError??false,
        scriptLoadedMs:state.scriptLoadedAt==null?null:Math.round(state.scriptLoadedAt-state.startedAt),
        scriptErrorMs:state.scriptErrorAt==null?null:Math.round(state.scriptErrorAt-state.startedAt),
        show11627577Type:typeof api,
        show11627577Present:typeof api==='function',
        show11627577String:api==null?String(api):String(api).slice(0,160),
        telegramPlatform:tg?.platform??'unknown',
        telegramVersion:tg?.version??'unknown',
        readyState:document.readyState,
        elapsedMs:Math.round(performance.now()-started),
        userAgent:navigator.userAgent,
        sdkResources:sdkResourceSnapshot(),
        events:state.events||[],
        globalErrors:state.globalErrors||[],
        unhandledRejection:state.unhandled||null,
        directFetch:state.fetch||null
      };
    }

    function render(extra={}){
      out.textContent=JSON.stringify({snapshot:snapshot(),...extra},null,2);
      adButton.disabled=typeof window.show_11627577!=='function';
    }

    async function runDiagnostic(){
      runButton.disabled=true;
      render({status:'Checking the real Monetag SDK and network…'});
      window.__dzMonetag.fetch=await probeSdkUrl();
      render({status:'Diagnostic complete. Check show11627577Present and directFetch.'});
      runButton.disabled=false;
    }

    runButton.addEventListener('click',runDiagnostic);

    adButton.addEventListener('click',async()=>{
      adButton.disabled=true;
      const api=window.show_11627577;
      const ymid='diagnostic-'+Date.now();
      render({status:'Calling the real show_11627577()',ymid});
      try{
        const adResult=await api({ymid,requestVar:'diagnostic'});
        render({status:'Advertisement completed',adResult,ymid});
      }catch(error){
        render({status:'Real SDK advertisement call failed',errorName:error?.name||'Error',errorMessage:String(error?.message||error),ymid});
      }finally{
        adButton.disabled=typeof window.show_11627577!=='function';
      }
    });

    const timer=setInterval(()=>{
      render({status:'Waiting for the real Monetag SDK…'});
      if(typeof window.show_11627577==='function'||performance.now()-started>30000)clearInterval(timer);
    },1000);

    render({status:'Waiting for the real Monetag SDK…'});
  </script>
</body>
</html>
