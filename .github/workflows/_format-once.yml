name: One-time formatter

on:
  push:
    branches: [chore/mechanical-guardrails]

permissions:
  contents: write
  workflows: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/mechanical-guardrails
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Format repository
        run: npm run format

      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:chore/mechanical-guardrails
