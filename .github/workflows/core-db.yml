name: Core Database

on:
  push:
    paths:
      - 'migrations/**'
      - 'src/db/**'
      - 'src/core/**'
      - 'scripts/core-*.js'
      - 'package.json'
      - '.github/workflows/core-db.yml'
  pull_request:
    paths:
      - 'migrations/**'
      - 'src/db/**'
      - 'src/core/**'
      - 'scripts/core-*.js'
      - 'package.json'
      - '.github/workflows/core-db.yml'

jobs:
  postgres-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dzmoney
          POSTGRES_PASSWORD: dzmoney
          POSTGRES_DB: dzmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dzmoney -d dzmoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dzmoney:dzmoney@localhost:5432/dzmoney_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run core:migrate
      - run: npm run core:check
