name: Lint and Complexity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    name: Format baseline measurement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Measure Prettier baseline
        shell: bash
        run: |
          set -o pipefail
          echo "PRETTIER_VERSION=$(npx prettier --version)"
          npx prettier public/gaming-runtime.css > /tmp/gaming-runtime.formatted.css
          if ! cmp -s public/gaming-runtime.css /tmp/gaming-runtime.formatted.css; then
            echo "GAMING_RUNTIME_PRETTIER_DIFF=true"
            diff -u public/gaming-runtime.css /tmp/gaming-runtime.formatted.css || true
          else
            echo "GAMING_RUNTIME_PRETTIER_DIFF=false"
          fi
          npx prettier . --list-different > prettier-offenders.txt || true
          count=$(wc -l < prettier-offenders.txt | tr -d ' ')
          echo "PRETTIER_OFFENDER_COUNT=$count"
          if [ "$count" -gt 0 ]; then
            cat prettier-offenders.txt
          fi

  complexity-gate:
    name: ESLint monotonic gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run ESLint and enforce baseline
        shell: bash
        run: |
          set +e
          npx eslint . --format json > eslint-report.json
          eslint_status=$?
          set -e
          node scripts/enforce-eslint-baseline.js
          baseline_status=$?
          if [ "$baseline_status" -ne 0 ]; then
            exit "$baseline_status"
          fi
          if [ "$eslint_status" -ne 0 ]; then
            echo "ESLINT_EXIT_STATUS=$eslint_status (existing baseline violations are permitted)"
          fi
