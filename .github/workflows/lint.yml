name: Lint and Complexity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Temporary format patch export
        run: |
          npm run format
          git diff --binary > /tmp/prettier.patch
      - name: Upload temporary format patch
        uses: actions/upload-artifact@v4
        with:
          name: prettier-format-patch
          path: /tmp/prettier.patch
      - name: Check formatting
        run: npm run format:check

  complexity-gate:
    name: Complexity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run ESLint complexity and correctness gate
        run: npm run lint
