name: ODRCA Formatter Cluster 3

on:
  push:
    branches: [odrca/prettier-docs-3]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Format isolated candidate
        run: npx prettier docs/ADR-0012-creator-campaign-pricing-10-dzx-per-valid-visit.md --write
      - name: Verify candidate
        run: |
          npx prettier docs/ADR-0012-creator-campaign-pricing-10-dzx-per-valid-visit.md --check
          git diff --check
      - name: Commit formatted candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ADR-0012-creator-campaign-pricing-10-dzx-per-valid-visit.md
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "chore(odrca): format creator campaign ADR"
            git push
          fi
