name: ODRCA Cluster 4 Formatter

on:
  push:
    branches:
      - odrca/prettier-cluster-4

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Format Cluster 4 only
        run: npx prettier --write docs/TASK_ENGINE_SPEC.md IMPLEMENTATION_STATUS.md PROJECT_ROADMAP.md

      - name: Verify only Cluster 4 files changed
        run: |
          git diff --name-only > /tmp/changed-files
          cat /tmp/changed-files
          if grep -v -E '^(docs/TASK_ENGINE_SPEC\.md|IMPLEMENTATION_STATUS\.md|PROJECT_ROADMAP\.md)$' /tmp/changed-files; then
            echo 'Unexpected file changed.'
            exit 1
          fi

      - name: Verify formatting
        run: npx prettier --check docs/TASK_ENGINE_SPEC.md IMPLEMENTATION_STATUS.md PROJECT_ROADMAP.md

      - name: Verify whitespace
        run: git diff --check

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TASK_ENGINE_SPEC.md IMPLEMENTATION_STATUS.md PROJECT_ROADMAP.md
          git commit -m 'chore(odrca): format Cluster 4 roadmap docs'
          git push origin HEAD:odrca/prettier-cluster-4
