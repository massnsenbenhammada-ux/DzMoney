name: ODRCA Cluster 10 Safe Set v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzmoney_test
      DATABASE_SSL: "false"
      ONCLICKA_ENABLED: "true"
      ONCLICKA_SPOT_ID: "6134799"
      TEST_TELEGRAM_USER_ID: ${{ secrets.TEST_TELEGRAM_USER_ID }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dzmoney_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run migrate
      - name: Format script-test candidates and classify by self-test
        shell: bash
        run: |
          set -uo pipefail
          npx prettier . --list-different > /tmp/all-offenders.txt || true
          awk '/^scripts\/test-.*\.js$/' /tmp/all-offenders.txt > /tmp/candidates.txt
          echo "PRETTIER_VERSION=$(npx prettier --version)"
          echo "CANDIDATE_COUNT=$(wc -l < /tmp/candidates.txt | tr -d ' ')"
          cat /tmp/candidates.txt
          if [ -s /tmp/candidates.txt ]; then
            xargs npx prettier --write < /tmp/candidates.txt
          fi
          git diff --check
          : > /tmp/failed-tests.txt
          while IFS= read -r file; do
            echo "=== SELF TEST: $file ==="
            if ! node "$file" > "/tmp/test-output.log" 2>&1; then
              echo "$file" | tee -a /tmp/failed-tests.txt
              tail -80 /tmp/test-output.log || true
            else
              echo "PASS: $file"
            fi
          done < /tmp/candidates.txt
          echo '--- SELF-TEST FAILURES ---'
          cat /tmp/failed-tests.txt
          echo '--- DIFF FILES ---'
          git diff --name-only
          echo '--- DIFF STAT ---'
          git diff --stat
          echo '--- RESULT ---'
          if [ -s /tmp/failed-tests.txt ]; then
            echo 'FORMAT_SELF_TEST_FAILURES_PRESENT=1'
          else
            echo 'FORMAT_SELF_TEST_FAILURES_PRESENT=0'
          fi
