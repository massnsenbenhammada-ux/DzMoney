name: Repair migrated server settings syntax

on:
  push:
    branches: [admin-safe-migration-v2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair only the known malformed migration block
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'server.js';
          let s = fs.readFileSync(file, 'utf8');
          const broken = `      const value = String(rawValue).trim(););\n      }\n\n      if (!allowedSettings.has(key)) {`;
          const fixed = `      const value = String(rawValue).trim();\n\n      if (!allowedSettings.has(key)) {`;
          const count = s.split(broken).length - 1;
          if (count === 0) {
            if (s.includes('const value = String(rawValue).trim();\n\n      if (!allowedSettings.has(key)) {')) {
              console.log('Known server settings block is already repaired.');
              process.exit(0);
            }
            throw new Error('Expected malformed server settings block was not found; refusing rewrite.');
          }
          if (count !== 1) throw new Error(`Expected one malformed block, found ${count}.`);
          s = s.replace(broken, fixed);
          fs.writeFileSync(file, s);
          NODE
      - name: Commit repair when needed
        run: |
          if git diff --quiet -- server.js; then
            echo "No repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Repair server settings migration syntax"
          git push origin HEAD:admin-safe-migration-v2
