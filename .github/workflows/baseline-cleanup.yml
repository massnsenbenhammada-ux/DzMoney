name: Baseline Cleanup

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to clean
        required: true
        default: chore/mechanical-guardrails
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    name: Mechanical formatting and lint fixes
    if: inputs.branch == 'chore/mechanical-guardrails'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Apply Prettier formatting
        run: npm run format

      - name: Apply safe ESLint autofixes
        run: npm run lint:fix

      - name: Commit mechanical fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No mechanical changes required."
          else
            git commit -m "chore: apply mechanical quality fixes"
            git push origin "HEAD:${{ inputs.branch }}"
          fi

      - name: Report remaining lint violations
        run: npm run lint
