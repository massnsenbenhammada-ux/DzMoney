name: Phase 1 Core Ledger

on:
  push:
    branches: [phase1-core-ledger]
  pull_request:
    branches: [main]

jobs:
  core-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run core ledger invariants
        run: node tests/core-ledger-invariants.js
