name: Repo Hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  numbered-file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check migration and ADR numbering
        run: node scripts/check-repo-hygiene.js
