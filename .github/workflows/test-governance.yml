name: Test Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/test-governance.js'
      - 'tests/test-governance.test.js'
      - '.github/workflows/test-governance.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/test-governance.js'
      - 'tests/test-governance.test.js'
      - '.github/workflows/test-governance.yml'

permissions:
  contents: read

jobs:
  test-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate test governance
        run: node --test ./tests/test-governance.test.js
      - name: Validate test:all directly
        run: node ./scripts/test-governance.js
