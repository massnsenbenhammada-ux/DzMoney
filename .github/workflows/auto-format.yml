name: Auto Format Repository

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to format
        required: true
        default: chore/mechanical-guardrails
        type: string

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier formatting
    if: inputs.branch == 'chore/mechanical-guardrails'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.FORMATTER_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Apply Prettier formatting
        run: npm run format

      - name: Commit and push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: apply repository Prettier formatting"
          git push origin "HEAD:${{ inputs.branch }}"
