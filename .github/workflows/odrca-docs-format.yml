name: ODRCA Docs Formatting Batch

on:
  push:
    branches: [odrca/prettier-docs-1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply exact Prettier output to classified low-risk documentation cluster
        run: |
          files=(
            DEVELOPMENT_LOG.md
            docs/ADR-0013-daily-checkin-canonical-task.md
            docs/ADR-0015-admin-users.md
            docs/ADR-0016-admin-referral.md
            docs/ADR-0017-ADMIN-ACCOUNT-ENFORCEMENT.md
            docs/ADR-0018-ADMIN-TASK-CAMPAIGN-REVIEW.md
            docs/ADR-TON-DEPOSIT-CONFIGURATION.md
            docs/ADR-TON-DEPOSIT-VERIFICATION.md
            docs/CONSTITUTION_54.md
            docs/PHASE2_DESIGN_REVIEW.md
          )
          npx prettier --write "${files[@]}"
      - name: Verify exact formatting and whitespace
        run: |
          files=(
            DEVELOPMENT_LOG.md
            docs/ADR-0013-daily-checkin-canonical-task.md
            docs/ADR-0015-admin-users.md
            docs/ADR-0016-admin-referral.md
            docs/ADR-0017-ADMIN-ACCOUNT-ENFORCEMENT.md
            docs/ADR-0018-ADMIN-TASK-CAMPAIGN-REVIEW.md
            docs/ADR-TON-DEPOSIT-CONFIGURATION.md
            docs/ADR-TON-DEPOSIT-VERIFICATION.md
            docs/CONSTITUTION_54.md
            docs/PHASE2_DESIGN_REVIEW.md
          )
          npx prettier --check "${files[@]}"
          git diff --check
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- DEVELOPMENT_LOG.md docs/ADR-0013-daily-checkin-canonical-task.md docs/ADR-0015-admin-users.md docs/ADR-0016-admin-referral.md docs/ADR-0017-ADMIN-ACCOUNT-ENFORCEMENT.md docs/ADR-0018-ADMIN-TASK-CAMPAIGN-REVIEW.md docs/ADR-TON-DEPOSIT-CONFIGURATION.md docs/ADR-TON-DEPOSIT-VERIFICATION.md docs/CONSTITUTION_54.md docs/PHASE2_DESIGN_REVIEW.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore(odrca): format low-risk documentation cluster 1"
          git push origin HEAD:odrca/prettier-docs-1
