name: ODRCA temporary docs formatter

on:
  push:
    branches:
      - odrca/prettier-docs-2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Format selected docs
        run: |
          npx prettier --write docs/PHASE4_SQUAD_SLICE2_NOTES.md docs/TASK_UX_FIX_SCOPE.md
          git diff --check
          npx prettier --check docs/PHASE4_SQUAD_SLICE2_NOTES.md docs/TASK_UX_FIX_SCOPE.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE4_SQUAD_SLICE2_NOTES.md docs/TASK_UX_FIX_SCOPE.md
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "chore(odrca): format low-risk documentation cluster 2"
          git push
