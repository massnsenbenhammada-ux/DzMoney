name: ODRCA Cluster 10 Low Risk Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzmoney_test
      DATABASE_SSL: "false"
      ONCLICKA_ENABLED: "true"
      ONCLICKA_SPOT_ID: "6134799"
      TEST_TELEGRAM_USER_ID: ${{ secrets.TEST_TELEGRAM_USER_ID }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dzmoney_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Run migrations
        run: npm run migrate
      - name: Format exact Cluster 10 low-risk set
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/test-check-for-update-navigation-regression.js
            scripts/test-phase7-conversion-boundary.js
            scripts/test-referral-attribution.js
            scripts/test-referral-bootstrap-foundation.js
            scripts/test-referral-link.js
            scripts/test-referral-telegram-bootstrap.js
            scripts/test-task-execution.js
            scripts/test-task-lifecycle.js
            scripts/test-task-card-creator-scope.js
            scripts/test-creator-panel-scope.js
          )
          npx prettier --write "${files[@]}"
          git diff --check
          npx prettier --check "${files[@]}"
          npm run test:all
          if git diff --quiet; then
            echo 'No formatting diff produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'chore(odrca): format Cluster 10 low-risk test set'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
