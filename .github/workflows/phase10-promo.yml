name: Phase 10 Promo Codes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  promo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: node --test ./tests/promo-code-contract.test.js

  promo-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzmoney
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dzmoney"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzmoney
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run migrate
      - run: node --test ./tests/promo-code-integration.test.js
