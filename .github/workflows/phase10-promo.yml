name: Phase 10 Promo Codes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  promo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: node --test ./tests/promo-code-contract.test.js
