name: Economy Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/economy-service.js'
      - 'src/services/wallet-service.js'
      - 'src/services/deposit-service.js'
      - 'migrations/**'
  push:
    branches: [main]
    paths:
      - 'src/services/economy-service.js'
      - 'src/services/wallet-service.js'
      - 'src/services/deposit-service.js'
      - 'migrations/**'

permissions:
  contents: read

jobs:
  economy-integrity:
    name: Economy / ledger integrity
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzmoney_test
      DATABASE_SSL: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dzmoney_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run migrations
        run: npm run migrate
      - name: Reconcile canonical economy
        run: npm run reconcile:economy
      - name: Run economy ledger tests
        run: npm run test:economy-ledger
      - name: Run Phase 13 ledger integrity tests
        run: npm run test:phase13-ledger-integrity
