name: ODRCA Cluster 10 Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Measure and classify formatter baseline
        shell: bash
        run: |
          set -o pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PRETTIER_VERSION=$(npx prettier --version)"
          npx prettier . --list-different > /tmp/prettier-offenders.txt || true
          count=$(wc -l < /tmp/prettier-offenders.txt | tr -d ' ')
          echo "PRETTIER_OFFENDER_COUNT=$count"
          echo "--- ALL OFFENDERS ---"
          cat /tmp/prettier-offenders.txt
          echo "--- FORMAT-SAFE SCRIPT CANDIDATES: no source-file reads/inspection markers ---"
          while IFS= read -r file; do
            case "$file" in
              scripts/test-*.js|scripts/simulate-*.js|scripts/reconcile-*.js|tests/*.js|tests/**/*.js)
                if ! grep -Eq "readFileSync|readFile\(|createReadStream|src/|public/|migrations/|server\.js|\.html|\.css|\.js['\"]" "$file"; then
                  echo "$file"
                fi
                ;;
            esac
          done < /tmp/prettier-offenders.txt
          echo "--- EXCLUDED SCRIPT CANDIDATES: source inspection / runtime coupling markers ---"
          while IFS= read -r file; do
            case "$file" in
              scripts/test-*.js|scripts/simulate-*.js|scripts/reconcile-*.js|tests/*.js|tests/**/*.js)
                if grep -Eq "readFileSync|readFile\(|createReadStream|src/|public/|migrations/|server\.js|\.html|\.css|\.js['\"]" "$file"; then
                  echo "$file"
                fi
                ;;
            esac
          done < /tmp/prettier-offenders.txt
          echo "--- DOCUMENTATION OFFENDERS ---"
          awk '/^docs\// || /^(README|PROJECT_ROADMAP|IMPLEMENTATION_STATUS|TODO|DEVELOPMENT_LOG|CONTEXT_SUMMARY|ADR)/ {print}' /tmp/prettier-offenders.txt
          echo "--- RUNTIME OFFENDERS (not candidates for a formatting-only cluster without file-level audit) ---"
          awk '/^(public\/|src\/|server\.js$|\.github\/workflows\/)/ {print}' /tmp/prettier-offenders.txt
