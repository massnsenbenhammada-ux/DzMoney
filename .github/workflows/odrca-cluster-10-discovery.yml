name: ODRCA Cluster 10 Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Measure and classify formatter baseline
        shell: bash
        run: |
          set -o pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PRETTIER_VERSION=$(npx prettier --version)"
          npx prettier . --list-different > /tmp/prettier-offenders.txt || true
          count=$(wc -l < /tmp/prettier-offenders.txt | tr -d ' ')
          echo "PRETTIER_OFFENDER_COUNT=$count"
          echo "--- FORMAT-SAFE SCRIPT CANDIDATES ---"
          while IFS= read -r file; do
            case "$file" in
              scripts/test-*.js|scripts/simulate-*.js|scripts/reconcile-*.js|tests/*.js|tests/**/*.js)
                if ! grep -Eq "readFileSync|readFile\(|createReadStream|src/|public/|migrations/|server\.js|\.html|\.css|\.js['\"]" "$file"; then
                  echo "$file"
                fi
                ;;
            esac
          done < /tmp/prettier-offenders.txt
          echo "--- SOURCE-INSPECTION / RUNTIME-COUPLED SCRIPT OFFENDERS ---"
          while IFS= read -r file; do
            case "$file" in
              scripts/test-*.js|scripts/simulate-*.js|scripts/reconcile-*.js|tests/*.js|tests/**/*.js)
                if grep -Eq "readFileSync|readFile\(|createReadStream|src/|public/|migrations/|server\.js|\.html|\.css|\.js['\"]" "$file"; then
                  echo "$file"
                fi
                ;;
            esac
          done < /tmp/prettier-offenders.txt
          echo "--- NON-SCRIPT OFFENDERS ---"
          grep -Ev '^(scripts/test-|scripts/simulate-|scripts/reconcile-|tests/)' /tmp/prettier-offenders.txt || true
