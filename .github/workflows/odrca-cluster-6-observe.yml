name: ODRCA Cluster 6 Observe

on:
  push:
    branches: [odrca/cluster-6-observe]

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Inspect selected candidate formatter diffs
        shell: bash
        run: |
          set -o pipefail
          for file in scripts/test-creator-task-input-validation.js scripts/test-creator-task-validation.js; do
            echo "===== $file ====="
            npx prettier "$file" > /tmp/formatted.js
            if cmp -s "$file" /tmp/formatted.js; then
              echo "DIFF=false"
            else
              echo "DIFF=true"
              diff -u "$file" /tmp/formatted.js || true
            fi
          done
