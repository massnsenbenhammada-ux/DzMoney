name: ODRCA Formatting Batch 1

on:
  push:
    branches:
      - chore/restore-quality-guardrails

permissions:
  contents: write

jobs:
  format-batch-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Format explicit Batch 1 files
        run: npx prettier --write DEVELOPMENT_LOG.md docs/ADR-0013-daily-checkin-canonical-task.md docs/ADR-0015-admin-users.md docs/ADR-0016-admin-referral.md docs/ADR-0017-ADMIN-ACCOUNT-ENFORCEMENT.md
      - name: Verify idempotence for Batch 1
        run: npx prettier --check DEVELOPMENT_LOG.md docs/ADR-0013-daily-checkin-canonical-task.md docs/ADR-0015-admin-users.md docs/ADR-0016-admin-referral.md docs/ADR-0017-ADMIN-ACCOUNT-ENFORCEMENT.md
      - name: Commit only Batch 1
        run: |
          git add DEVELOPMENT_LOG.md docs/ADR-0013-daily-checkin-canonical-task.md docs/ADR-0015-admin-users.md docs/ADR-0016-admin-referral.md docs/ADR-0017-ADMIN-ACCOUNT-ENFORCEMENT.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -le 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format baseline batch 1"
          git push origin HEAD:chore/restore-quality-guardrails
