name: ODRCA Cluster 9 exact formatting discovery

on:
  push:
    branches:
      - odrca/discovery-cluster-9-exact

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Generate exact Prettier patch and commit Cluster 9
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --version
          npx prettier . --write
          git diff --binary -- . ':!package-lock.json' > /tmp/cluster9-prettier.patch
          git diff --numstat -- . ':!package-lock.json' > /tmp/cluster9-numstat.txt
          git diff --name-only -- . ':!package-lock.json' > /tmp/cluster9-files.txt
          echo "FORMATTING_DIFF_FILES=$(wc -l < /tmp/cluster9-files.txt | tr -d ' ')"
          echo "FORMATTING_DIFF_LINES=$(git diff --numstat -- . ':!package-lock.json' | awk '{a+=$1; d+=$2} END {print a+d}')"
          git restore --staged . 2>/dev/null || true
          git add -- \
            .github/workflows/phase10-promo.yml \
            .github/workflows/phase2-boundaries.yml \
            IMPLEMENTATION_STATUS.md \
            public/admin-tabs.js \
            public/admin-enforcement.js \
            public/adsgram-adapter-entry.js \
            public/gigapub-adapter-entry.js \
            public/monetag-adapter-entry.js \
            public/onclicka-adapter-entry.js \
            public/onclicka-sdk-loader.js \
            scripts/test-governance.js \
            scripts/test-input-validation.js
          if git diff --cached --quiet; then
            echo 'No selected Cluster 9 formatting changes.'
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(odrca): format Cluster 9'
          git push origin HEAD:odrca/discovery-cluster-9-exact
      - name: Upload exact patch evidence
        uses: actions/upload-artifact@v4
        with:
          name: odrca-cluster9-exact-prettier-patch
          path: |
            /tmp/cluster9-prettier.patch
            /tmp/cluster9-numstat.txt
            /tmp/cluster9-files.txt
          if-no-files-found: error

# Temporary ODRCA discovery only; remove after evidence collection.
