name: Admin safe CI

on:
  push:
    branches: [admin-safe-migration, admin-safe-migration-v2]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply guarded server migration repair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'server.js';
          let s = fs.readFileSync(file, 'utf8');
          const broken = `      const value = String(rawValue).trim(););\n      }\n\n      if (!allowedSettings.has(key)) {`;
          const fixed = `      const value = String(rawValue).trim();\n\n      if (!allowedSettings.has(key)) {`;
          const count = s.split(broken).length - 1;
          if (count > 1) throw new Error(`Expected at most one malformed block, found ${count}.`);
          if (count === 1) {
            s = s.replace(broken, fixed);
            fs.writeFileSync(file, s);
            console.log('Known malformed server settings block repaired.');
          } else {
            console.log('Server settings block already clean.');
          }
          NODE
          if ! git diff --quiet -- server.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server.js
            git commit -m "Repair server settings migration syntax"
            git push origin HEAD:admin-safe-migration-v2
          fi
      - name: Syntax check critical runtime files
        run: |
          node --check server.js
          node --check runtime-settings-service.js
          node --check admin-panel-core-v2.js
          node --check scripts/migrate-server-runtime-settings.js
      - name: Admin safe audit
        run: npm run admin:safe-audit
