name: Admin safe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: |
          node --check server.js
          node --check admin-panel-core-v2.js
          node --check runtime-settings-service.js
          node --check scripts/migrate-admin-v3.js
      - name: Admin safe audit
        run: npm run admin:safe-audit
      - name: Verify Admin v3 migration is wired
        run: node -e "const p=require('./package.json'); if(!p.scripts.start.includes('migrate-admin-v3.js')) process.exit(1); console.log('Admin v3 migration wired');"
