name: ODRCA Batch 3 Format Artifact

on:
  push:
    branches: [odrca/batch-3-format-artifact]

permissions:
  contents: write

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Format isolated Batch 3 candidates
        run: |
          npx prettier --write \
            public/creator-task.css \
            public/conversion.css \
            public/admin.css \
            public/premium-ui.css \
            public/squad.css
      - name: Verify isolated formatting
        run: |
          npx prettier --check \
            public/creator-task.css \
            public/conversion.css \
            public/admin.css \
            public/premium-ui.css \
            public/squad.css
      - name: Validate and commit only Batch 3 files
        run: |
          git diff --check
          if git diff --quiet -- public/creator-task.css public/conversion.css public/admin.css public/premium-ui.css public/squad.css; then
            echo "No Batch 3 formatting changes remain."
            exit 0
          fi
          git status --short
          git add -- public/creator-task.css public/conversion.css public/admin.css public/premium-ui.css public/squad.css
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(odrca): format Batch 3 CSS candidates'
          git push
      - name: Upload formatted candidates
        uses: actions/upload-artifact@v4
        with:
          name: odrca-batch3-format-candidates
          path: |
            public/creator-task.css
            public/conversion.css
            public/admin.css
            public/premium-ui.css
            public/squad.css
          if-no-files-found: error
