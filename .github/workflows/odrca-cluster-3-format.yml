name: ODRCA Cluster 3 Formatter

on:
  push:
    branches:
      - odrca/prettier-cluster-3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Cluster 3 candidates
        run: npx prettier --write scripts/test-gaming.js scripts/test-onclicka-gaming-callback.js scripts/simulate-gaming-economy.js scripts/test-gaming-ad-provider-trace.js docs/PHASE5_GAMING.md docs/SQUAD_SYSTEM_CONTRACT.md migrations/039_gaming_tasks.sql
      - name: Check formatting
        run: npx prettier --check scripts/test-gaming.js scripts/test-onclicka-gaming-callback.js scripts/simulate-gaming-economy.js scripts/test-gaming-ad-provider-trace.js docs/PHASE5_GAMING.md docs/SQUAD_SYSTEM_CONTRACT.md migrations/039_gaming_tasks.sql
      - name: Check whitespace
        run: git diff --check
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-gaming.js scripts/test-onclicka-gaming-callback.js scripts/simulate-gaming-economy.js scripts/test-gaming-ad-provider-trace.js docs/PHASE5_GAMING.md docs/SQUAD_SYSTEM_CONTRACT.md migrations/039_gaming_tasks.sql
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git commit -m "chore(odrca): format Cluster 3 Gaming contract surface"
          git push
