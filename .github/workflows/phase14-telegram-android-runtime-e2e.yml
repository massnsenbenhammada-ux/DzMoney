name: Phase 14 Telegram Android Runtime E2E

on:
  workflow_dispatch:
    inputs:
      run_real_provider:
        description: 'Run the real-provider Telegram Mini App flow (requires authenticated test account secrets)'
        required: true
        default: false
        type: boolean
      run_authenticated_webview:
        description: 'Make Telegram WebView authentication a blocking gate'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - feat/phase14-android-real-state-runtime
    paths:
      - '.github/workflows/phase14-telegram-android-runtime-e2e.yml'
      - 'scripts/telegram-android-runtime-bootstrap.sh'
      - 'scripts/telegram-android-test-auth.sh'
      - 'scripts/telegram-android-webview-runtime.js'
      - 'tests/e2e/**'
      - 'public/**'
      - 'src/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

env:
  TELEGRAM_TEST_MINI_APP_URL: https://t.me/DzMoneyCITestBot/DzMoney

jobs:
  android-runtime:
    name: Android Emulator + Telegram runtime harness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_API_LEVEL: 30
      ANDROID_TARGET: google_apis
      ANDROID_ARCH: x86
      AVD_NAME: dzmoney-api30
      DZ_MONEY_MINI_APP_URL: https://t.me/DzMoneyCITestBot/DzMoney
      TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
      TELEGRAM_TEST_USER_ID: ${{ secrets.TELEGRAM_TEST_USER_ID }}
      TELEGRAM_TEST_PHONE: ${{ secrets.TELEGRAM_TEST_PHONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Telegram Test credentials
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_TEST_BOT_TOKEN"
          test -n "$TELEGRAM_TEST_USER_ID"
          test -n "$TELEGRAM_TEST_PHONE"
          case "$TELEGRAM_TEST_USER_ID" in
            ''|*[!0-9]*) echo 'TELEGRAM_TEST_USER_ID must be numeric'; exit 1 ;;
          esac
          echo "TELEGRAM_TEST_USER_ID configured: yes"
          echo "TELEGRAM_TEST_PHONE configured: yes"
          BOT_JSON="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "https://api.telegram.org/bot${TELEGRAM_TEST_BOT_TOKEN}/test/getMe")"
          echo "$BOT_JSON" | grep -F '"ok":true'
          echo "$BOT_JSON" | grep -F '"username":"DzMoneyCITestBot"'
          echo 'TELEGRAM_TEST_BOT_TOKEN: Test Bot API authentication passed.'

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-dzmoney-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TELEGRAM_WEBVIEW_BLOCKING: ${{ inputs.run_authenticated_webview == true }}
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          heap-size: 256M
          force-avd-creation: false
          emulator-boot-timeout: 240
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          disable-animations: true
          script: bash scripts/telegram-android-runtime-bootstrap.sh

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-android-runtime-evidence
          path: |
            telegram-mini-app-runtime.png
            telegram-mini-app-logcat.txt
            telegram-webview-runtime.txt
            telegram-auth-ui.xml
          if-no-files-found: ignore

      - name: Real provider gate preflight
        if: ${{ inputs.run_real_provider }}
        run: |
          echo 'Real-provider execution was requested.'
          echo 'Provider callbacks remain real-state only; this workflow does not fabricate ad completion.'
          test -n "$TELEGRAM_TEST_USER_ID"
          test -n "$TELEGRAM_TEST_BOT_TOKEN"
          test -n "${{ secrets.REAL_AD_PROVIDER_TEST_CONFIG }}"
